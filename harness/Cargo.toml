[package]
name = "nu-grammar-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "Parses the grammar corpus with nu-parser and compares the verdicts with corpus/expected"

# Every nushell crate comes from one pinned revision of nushell `main`, the nu-parser the
# verdicts in `../corpus/expected` describe. To move to a newer nushell, change `rev` in every
# line below (and `Cargo.lock` with `cargo update`), then run `UPDATE_EXPECTED=1 cargo test`
# and review the changed verdicts.
#
# The crates and features are the `nu` binary's defaults (`network`, `plugin`, `rustls-tls`,
# `sqlite`, `trash-support`), so the engine knows exactly the commands `nu` knows.
[dependencies]
nu-cli = { git = "https://github.com/nushell/nushell", rev = "a4819256a2d875ca42c8600242388da291f3beaa", features = ["plugin", "sqlite"] }
nu-cmd-extra = { git = "https://github.com/nushell/nushell", rev = "a4819256a2d875ca42c8600242388da291f3beaa" }
nu-cmd-lang = { git = "https://github.com/nushell/nushell", rev = "a4819256a2d875ca42c8600242388da291f3beaa", features = ["plugin"] }
nu-cmd-plugin = { git = "https://github.com/nushell/nushell", rev = "a4819256a2d875ca42c8600242388da291f3beaa" }
nu-command = { git = "https://github.com/nushell/nushell", rev = "a4819256a2d875ca42c8600242388da291f3beaa", features = ["plugin", "sqlite", "trash-support"] }
nu-experimental = { git = "https://github.com/nushell/nushell", rev = "a4819256a2d875ca42c8600242388da291f3beaa" }
nu-explore = { git = "https://github.com/nushell/nushell", rev = "a4819256a2d875ca42c8600242388da291f3beaa" }
nu-parser = { git = "https://github.com/nushell/nushell", rev = "a4819256a2d875ca42c8600242388da291f3beaa", features = ["plugin"] }
nu-protocol = { git = "https://github.com/nushell/nushell", rev = "a4819256a2d875ca42c8600242388da291f3beaa", features = ["plugin", "sqlite"] }
nu-std = { git = "https://github.com/nushell/nushell", rev = "a4819256a2d875ca42c8600242388da291f3beaa", features = ["sqlite"] }
nu-tui = { git = "https://github.com/nushell/nushell", rev = "a4819256a2d875ca42c8600242388da291f3beaa" }
# The diagnostic labels of a parse error; the version nushell uses.
miette = "7.6"

[dev-dependencies]
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]
